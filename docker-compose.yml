services:
  # Backend (FastAPI)
  backend:
    image: ecg-app-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./models:/app/models
      - user_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - ECHOVOTE_DB_PATH=/app/data/users.db
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5m

  # Frontend (React + Nginx)
  frontend:
    image: ecg-app-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  models:
  user_data:
